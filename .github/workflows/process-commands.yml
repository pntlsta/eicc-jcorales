name: Process Tracker Commands

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply commands from issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/apply-commands.js

      - name: Commit changes
        run: |
          git config user.name "tracker-bot"
          git config user.email "actions@github.com"
          git add data/assignments.json data/notes.json
          git diff --quiet --cached || git commit -m "Tracker update via issue #${{ github.event.issue.number }}"
          git push

      - name: Comment results and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('command-results.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "**Tracker update results:**\n\n```\n" + summary + "\n```"
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
